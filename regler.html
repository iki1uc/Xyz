<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>index · regel · gegen noise</title>
<style>
  :root{
    --bg:#0a0a0c; --fg:#e8e8ea; --dim:#6a6a72;
    --linie:#1e1e24; --gut:#3ddc84; --noise:#5a3a3a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:32px 20px;
  }
  header{max-width:900px;margin:0 auto 24px}
  h1{margin:0;font-size:20px;letter-spacing:.05em}
  .unter{color:var(--dim);margin-top:4px}
  .regel{
    max-width:900px;margin:0 auto 24px;padding:12px 16px;
    border:1px solid var(--linie);border-radius:6px;
    color:var(--dim);
  }
  .regel b{color:var(--fg);font-weight:600}
  main{max-width:900px;margin:0 auto;display:grid;gap:12px}
  .karte{
    border:1px solid var(--linie);border-radius:6px;
    padding:12px 16px;background:#0e0e12;
  }
  .karte.noise{background:#120e0e;border-color:var(--noise)}
  .kopf{display:flex;justify-content:space-between;margin-bottom:8px}
  .name{font-weight:600}
  .status{color:var(--dim);font-size:12px}
  .karte.geregelt .status{color:var(--gut)}
  .karte.noise .status{color:var(--noise)}
  pre.head{
    margin:0;white-space:pre-wrap;color:var(--dim);
    font-size:12px;line-height:1.5;
  }
  .noise-block{margin-top:24px;border-top:1px solid var(--linie);padding-top:16px}
  .noise-block h2{font-size:13px;color:var(--noise);margin:0 0 12px}
  button{
    background:none;border:1px solid var(--linie);color:var(--dim);
    padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit;
  }
  button:hover{color:var(--fg);border-color:var(--fg)}
  footer{max-width:900px;margin:32px auto 0;color:var(--dim);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>index</h1>
  <div class="unter">regel · geregelt · gegen noise</div>
</header>

<div class="regel">
  <b>regel:</b> masse 1:1 · kosten 50/50 · 3× selbe frage = warnung · toleranz 0.15<br>
  <b>satz:</b> zeigen, nicht halten · lesen, nicht greifen
</div>

<main id="karten"></main>

<footer id="log">lade …</footer>

<script>
// —— liste: alle files im repo ——
const DATEIEN = [
  'root.html','basis.html','1.html','brett.html','zug.html','feld.html',
  'kehre.html','lie.html','gpunkt.html','genstrang.html',
  'hardcore.html','ninja.html','shuffle.html','tunnel.html','probe.html',
  'boss.html','indexer.html'
];

// —— noise erkennen: hat es einen head? ——
function headLesen(text){
  const m = text.match(/<!--([\s\S]*?)-->/);
  if(!m) return null;
  const h = m[1].trim();
  return /name\s*:/.test(h) ? h : null;
}

async function lade(file){
  try{
    const r = await fetch(file);
    if(!r.ok) return {file, status:'fehlt', head:null};
    const t = await r.text();
    const head = headLesen(t);
    return {file, status: head ? 'geregelt' : 'noise', head};
  }catch(e){
    return {file, status:'nicht lesbar', head:null};
  }
}

function karte(d){
  const el = document.createElement('div');
  el.className = 'karte ' + d.status;
  el.innerHTML =
    '<div class="kopf">' +
      '<span class="name">' + d.file + '</span>' +
      '<span class="status">' + d.status + '</span>' +
    '</div>' +
    '<pre class="head">' + (d.head || '— kein head · noise —') + '</pre>';
  return el;
}

async function main(){
  const ziel  = document.getElementById('karten');
  const log   = document.getElementById('log');
  const alle  = await Promise.all(DATEIEN.map(lade));

  const geregelt = alle.filter(e => e.status === 'geregelt');
  const noise    = alle.filter(e => e.status !== 'geregelt');

  ziel.innerHTML = '';
  geregelt.forEach(e => ziel.appendChild(karte(e)));

  if(noise.length){
    const block = document.createElement('div');
    block.className = 'noise-block';
    block.innerHTML = '<h2>noise · ' + noise.length + ' · nicht geregelt</h2>';
    noise.forEach(e => block.appendChild(karte(e)));
    ziel.appendChild(block);
  }

  log.textContent =
    'geregelt: ' + geregelt.length +
    ' · noise: ' + noise.length +
    ' · regel: 1:1 · 50/50 · 3× warnung';
}

main();
</script>
</body>
</html>
