<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>zauber · öl · index</title>
<style>
  html,body{margin:0;background:#02060a;overflow:hidden;height:100%;cursor:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

let t0 = performance.now();
function loop(now){
  const t = (now - t0) / 1000;
  
  // grund
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.6);
  g.addColorStop(0, '#040810');
  g.addColorStop(1, '#02060a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  
  // das öl · ein punkt der atmet
  const atem = 0.5 + 0.5 * Math.sin(t * 0.6);
  const r = Math.min(W, H) * (0.08 + atem * 0.04);
  
  // außen · die schleuse
  for (let k = 0; k < 3; k++){
    ctx.strokeStyle = `rgba(92,240,255,${0.06 + atem * 0.04})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(W/2, H/2, r * (1 + k * 0.4), 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // kern · der tropfen öl
  const cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r);
  cg.addColorStop(0, `rgba(255,215,0,${0.6 + atem * 0.3})`);
  cg.addColorStop(0.6, `rgba(255,138,42,${0.2 + atem * 0.15})`);
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(W/2, H/2, r, 0, Math.PI * 2);
  ctx.fill();
  
  // kleine funken · die reibung
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * Math.PI * 2 + t * 0.05;
    const rr = r * (1.6 + Math.sin(t * 0.4 + i) * 0.1);
    const x = W/2 + Math.cos(a) * rr;
    const y = H/2 + Math.sin(a) * rr;
    const s = 1.5 + Math.sin(t * 1.2 + i * 1.3) * 0.8;
    ctx.fillStyle = `rgba(92,240,255,${0.3 + atem * 0.3})`;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // wort · unten
  ctx.fillStyle = 'rgba(92,240,255,0.35)';
  ctx.font = '11px Consolas';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('öl · das, was läuft, damit alles läuft', W/2, H - 24);
  
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
